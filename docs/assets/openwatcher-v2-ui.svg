      <rect class="cell" x="296" y="293" width="24" height="24" rx="4" fill="#174b63"/><rect class="cell" x="326" y="293" width="24" height="24" rx="4" fill="#18b7b6"/><rect class="cell" x="356" y="293" width="24" height="24" rx="4" fill="#1591a2"/><rect class="cell" x="386" y="293" width="24" height="24" rx="4" fill="#2df1d3"/>
