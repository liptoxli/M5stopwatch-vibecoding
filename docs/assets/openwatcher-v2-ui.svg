    <g filter="url(#softGlow)" stroke="#a7f000"><line x1="163" y1="384" x2="208" y2="384"/><line x1="258" y1="384" x2="303" y2="384"/></g><circle cx="233" cy="384" r="3.5" fill="#c9ff53"/>
