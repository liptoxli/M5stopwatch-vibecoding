<svg xmlns="http://www.w3.org/2000/svg" width="932" height="932" viewBox="0 0 466 466" role="img" aria-labelledby="title desc">
  <title id="title">OpenWatcher V2 Codex interface</title>
  <desc id="desc">Circular black interface with semantic quota gradient, remaining quota, daily usage and four-hour activity heatmap.</desc>
  <defs>
    <clipPath id="screen"><circle cx="233" cy="233" r="232"/></clipPath>
    <linearGradient id="quota" x1="22" y1="130" x2="400" y2="52" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff4038"/><stop offset=".34" stop-color="#ff9f19"/><stop offset=".68" stop-color="#ffd43b"/><stop offset="1" stop-color="#55f36a"/></linearGradient>
    <linearGradient id="leftValue" x1="174" y1="118" x2="303" y2="180" gradientUnits="userSpaceOnUse"><stop stop-color="#77f4a8"/><stop offset="1" stop-color="#30d978"/></linearGradient>
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.soft{fill:#adb9cc}.divider{stroke:#314052;stroke-width:1}.cell{stroke:#145484;stroke-opacity:.62;stroke-width:1}</style>
  </defs>
  <g clip-path="url(#screen)">
    <rect width="466" height="466" fill="#05070b"/>
    <circle cx="233" cy="233" r="231.5" fill="none" stroke="#26303d" stroke-width="1"/>
    <path d="M 10 233 A 223 223 0 0 1 456 233" fill="none" stroke="#1e2a3c" stroke-width="7" opacity=".72"/>
    <path d="M 10 233 A 223 223 0 0 1 416 106" fill="none" stroke="url(#quota)" stroke-width="7" stroke-linecap="butt"/>
    <text x="233" y="64" text-anchor="middle" font-size="24" font-weight="500" fill="#35b8ff">Codex Clear</text>
    <text x="233" y="99" text-anchor="middle" font-size="19" font-weight="600" class="soft">LEFT</text>
    <text x="57" y="137" font-size="18" font-weight="500" fill="#ff7438">TODAY</text>
    <text x="54" y="171" font-size="36" font-weight="650" fill="#ff7438">4%</text>
    <path d="M50 181 H122 L147 205 H168" fill="none" stroke="#ff7438" stroke-width="1.5"/><circle cx="168" cy="205" r="3.5" fill="#ff7438"/>
